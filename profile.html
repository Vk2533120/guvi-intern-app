<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Intern App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar with logout -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Intern App</a>
            <div class="navbar-nav ms-auto">
                <span class="nav-link text-light" id="nav-username"></span>
                <a class="nav-link" href="#" id="btn-logout">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Profile page -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">My Profile</h3>

                        <!-- Alert container -->
                        <div id="alert-container"></div>

                        <!-- Loading spinner (shown while fetching) -->
                        <div id="loading" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <!-- Profile form (hidden until data loads) -->
                        <form id="profile-form" class="d-none" novalidate>
                            <!-- Read-only MySQL fields -->
                            <fieldset disabled>
                                <legend class="h6 text-muted">Account Info (read-only)</legend>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email">
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username">
                                </div>
                            </fieldset>

                            <hr>

                            <!-- Editable MongoDB profile fields -->
                            <legend class="h6 text-muted">Extended Profile</legend>
                            <div class="mb-3">
                                <label for="age" class="form-label">Age</label>
                                <input type="number" class="form-control" id="age"
                                       min="1" max="150" placeholder="e.g. 22">
                            </div>
                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob">
                            </div>
                            <div class="mb-3">
                                <label for="contact" class="form-label">Contact Number</label>
                                <input type="tel" class="form-control" id="contact"
                                       placeholder="+91 98765 43210">
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" rows="3"
                                          placeholder="Your full address"></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100" id="btn-update">
                                Update Profile
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
